<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Water Control</title>

<style>
button{
flex:1;
padding:15px;
font-size:16px;
font-weight:bold;
border:none;
border-radius:10px;
cursor:pointer;
}
body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:10px;
}

h2{
text-align:center;
}

.card{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:12px;
box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.label{
font-size:14px;
color:#666;
}

.value{
font-size:24px;
font-weight:bold;
margin-top:5px;
}

.online{
color:green;
}

.offline{
color:red;
}
.status-auto{
color:#28a745;
}

.status-manual{
color:#007bff;
}

.status-idle{
color:#6c757d;
}

.status-error{
color:#dc3545;
}

.status-online{
color:#28a745;
}

.status-offline{
color:#dc3545;
}

.status-pump-on{
color:#28a745;
}

.status-pump-off{
color:#dc3545;
}

.status-alarm{
color:#dc3545;
font-weight:bold;
}
</style>

</head>

<body>

<h2>KONTROL AIR ESP32</h2>
<div class="card">

<div style="display:flex;gap:10px">

<button onclick="sendCmd('AUTO')">
AUTO
</button>

<button onclick="sendCmd('MANUAL')">
MANUAL
</button>

<button onclick="sendCmd('STOP')">
STOP
</button>

</div>   
<div style="display:flex;gap:10px;margin-top:10px">

<button
style="background:#28a745;color:white"
onclick="sendCmd('PUMP_ON')">
PUMP ON
</button>

<button
style="background:#dc3545;color:white"
onclick="sendCmd('PUMP_OFF')">
PUMP OFF
</button>

</div>
</div>
<div class="card">
<div class="label">MODE</div>
<div class="value" id="mode">---</div>
</div>

<div class="card">
<div class="label">PUMP</div>
<div class="value" id="pump">---</div>
</div>

<div class="card">
<div class="label">LEVEL BAK</div>
<div class="value" id="bak">---</div>
</div>

<div class="card">
<div class="label">FLOW</div>
<div class="value" id="flow">---</div>
</div>

<div class="card">
<div class="label">HARI INI</div>
<div class="value" id="today">---</div>
</div>

<div class="card">
<div class="label">TOTAL AIR</div>
<div class="value" id="lifetime">---</div>
</div>

<div class="card">
<div class="label">ALARM</div>
<div class="value" id="alarm">---</div>
</div>

<div class="card">
<div class="label">ESP32</div>
<div class="value" id="online">---</div>
</div>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script>

const client = mqtt.connect(
'wss://7670300b39ba4d55a0ec6d11ce773787.s1.eu.hivemq.cloud:8884/mqtt',
{
username:'hnrvito',
password:'Jangandiingat1'
});

client.on('connect', function(){

console.log("MQTT Connected");

client.subscribe("water/mode");
client.subscribe("water/pump");
client.subscribe("water/bak");
client.subscribe("water/flow");
client.subscribe("water/today");
client.subscribe("water/lifetime");
client.subscribe("water/alarm");
client.subscribe("water/online");

});

client.on('message', function(topic,message){

let value = message.toString();

if(topic=="water/mode")
{
let el=document.getElementById("mode");

el.innerHTML=value;

if(value=="AUTO")
el.className="value status-auto";

else if(value=="MANUAL")
el.className="value status-manual";

else if(value=="IDLE")
el.className="value status-idle";

else
el.className="value status-error";
}

if(topic=="water/pump")
{
let el=document.getElementById("pump");

el.innerHTML=value;

if(value=="ON")
el.className="value status-pump-on";
else
el.className="value status-pump-off";
}

if(topic=="water/bak")
document.getElementById("bak").innerHTML=value;

if(topic=="water/flow")
document.getElementById("flow").innerHTML=value;

if(topic=="water/today")
document.getElementById("today").innerHTML=value;

if(topic=="water/lifetime")
document.getElementById("lifetime").innerHTML=value;

if(topic=="water/alarm")
{
    let el=document.getElementById("alarm");

    el.innerHTML=value;

    if(
        value=="NORMAL" ||
        value=="SISTEM NORMAL"
    )
    {
        el.className="value";
    }
    else
    {
        el.className="value status-alarm";
    }
}

if(topic=="water/online")
{
let el=document.getElementById("online");

el.innerHTML=value;

if(value=="ONLINE")
el.className="value status-online";
else
el.className="value status-offline";
}

});
function sendCmd(cmd)
{
    client.publish(
        "water/cmd",
        cmd
    );

    console.log(
        "SEND : " + cmd
    );
}
</script>
</body>
</html>
